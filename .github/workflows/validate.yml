name: Validate skill
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check examples and package
        run: python3 -m unittest discover -s tests -v
      - name: Build portable skill
        run: python3 scripts/package.py
